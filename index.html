<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="description" content="ShapeForge: A free, open-source visual animation editor. Draw shapes, add animations, and export standalone HTML files. No signup required.">
  <meta property="og:title" content="ShapeForge - Visual Animation Editor">
  <meta property="og:description" content="Draw shapes, add animations, and export standalone HTML files directly in your browser.">
  <meta property="og:type" content="website">
  <title>ShapeForge — Visual Animation Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--bg:#0d0d0d;--sf:#141414;--cd:#1c1c1c;--bd:#2a2a2a;--fg:#ececec;--mt:#6b6b6b;--ac:#ff6b35;--acd:rgba(255,107,53,.15);--tl:#00d4aa;--dn:#ff4757}
    *{-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;-webkit-tap-highlight-color:transparent!important;box-sizing:border-box;margin:0;padding:0}
    html,body{touch-action:none!important;overscroll-behavior:none!important;overflow:hidden!important}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);height:100vh;position:fixed;inset:0}
    h1,h2,h3{font-family:'Space Grotesk',sans-serif}
    input[type="text"],textarea,input[type="number"],select{-webkit-user-select:text!important;user-select:text!important;touch-action:manipulation!important}
    input[type="color"],input[type="range"]{touch-action:manipulation!important}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

    #ws{background-color:#1a1a2e;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:20px 20px;position:relative;touch-action:none;transition:box-shadow .2s}
    #ws.drop-active{box-shadow:0 0 0 3px var(--ac),0 0 40px rgba(255,107,53,.2)!important}
    #ws.no-grid{background-image:none!important}

    .sh-card{width:66px;height:66px;border-radius:12px;border:1.5px solid var(--bd);background:var(--cd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:none;transition:all .12s}
    .sh-card:active{transform:scale(.9);border-color:var(--ac);background:var(--acd)}
    .sh-card .sl{font-size:8px;color:var(--mt);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .pv-r{width:24px;height:16px;background:var(--ac);border-radius:3px;border:2px solid rgba(255,255,255,.3)}
    .pv-c{width:20px;height:20px;background:var(--tl);border-radius:50%;border:2px solid rgba(255,255,255,.3)}
    .pv-l{width:24px;height:3px;background:var(--fg);border-radius:2px;transform:rotate(-30deg)}
    .pv-t{font-size:20px;font-weight:700;color:var(--fg);font-family:'Space Grotesk',sans-serif;line-height:1}

    .md-btn{width:66px;height:36px;border-radius:8px;border:1.5px solid var(--bd);background:var(--cd);display:flex;align-items:center;justify-content:center;gap:5px;touch-action:none;transition:all .12s;font-size:11px;color:var(--mt);font-weight:600;font-family:'DM Sans',sans-serif}
    .md-btn:active{transform:scale(.92)}.md-btn.on{border-color:var(--ac);background:var(--acd);color:var(--ac)}

    .ab{height:32px;min-width:32px;border-radius:7px;border:1px solid var(--bd);background:var(--cd);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;transition:all .1s;font-size:11px;color:var(--mt);padding:0 7px;gap:4px;font-family:'DM Sans',sans-serif}
    .ab:active{transform:scale(.9);background:var(--bd)}.ab.on{border-color:var(--ac);background:var(--acd);color:var(--ac)}

    .qc{width:20px;height:20px;border-radius:5px;touch-action:manipulation;border:2px solid transparent;transition:all .08s;flex-shrink:0}
    .qc:active{transform:scale(.85)}

    #dragGhost{position:fixed;pointer-events:none;z-index:99999;width:70px;height:70px;border-radius:14px;background:rgba(28,28,28,.92);border:2px solid var(--ac);display:none;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(0,0,0,.5);transform:translate(-50%,-50%)}

    .we{position:absolute;touch-action:none}
    #so{position:absolute;pointer-events:none;z-index:900;display:none;touch-action:none}

    .rh,.ep{position:absolute;width:34px;height:34px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:auto;z-index:901;background:transparent}
    .rh::after,.ep::after{content:'';width:12px;height:12px;background:var(--ac);border:2px solid #fff;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .ep::after{width:14px;height:14px;border-radius:50%;background:var(--tl)}

    .rh.h-tl{top:-17px;left:-17px;cursor:nwse-resize}.rh.h-tc{top:-17px;left:calc(50% - 17px);cursor:ns-resize}
    .rh.h-tr{top:-17px;right:-17px;cursor:nesw-resize}.rh.h-ml{top:calc(50% - 17px);left:-17px;cursor:ew-resize}
    .rh.h-mr{top:calc(50% - 17px);right:-17px;cursor:ew-resize}.rh.h-bl{bottom:-17px;left:-17px;cursor:nesw-resize}
    .rh.h-bc{bottom:-17px;left:calc(50% - 17px);cursor:ns-resize}.rh.h-br{bottom:-17px;right:-17px;cursor:nwse-resize}
    .ep{cursor:move;transform:translate(-50%,-50%)}

    .pi{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;color:var(--fg);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .12s;touch-action:manipulation}
    .pi:focus{border-color:var(--ac)}
    .pl{font-size:9px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:600}
    .sh{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--mt);padding:8px 0 5px;border-bottom:1px solid var(--bd);margin-bottom:6px;font-weight:700}
    .cs{width:28px;height:28px;border-radius:6px;border:2px solid var(--bd);cursor:pointer;position:relative;overflow:hidden;flex-shrink:0;touch-action:manipulation}
    .cs input[type="color"]{position:absolute;top:-8px;left:-8px;width:44px;height:44px;border:none;cursor:pointer;opacity:0}

    .li{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:7px;touch-action:manipulation;font-size:11px;border:1px solid transparent;transition:background .08s}
    .li:active{background:var(--cd)}.li.on{background:var(--acd);border-color:rgba(255,107,53,.3)}
    .li .ic{width:16px;text-align:center;color:var(--mt);font-size:10px}
    .li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .li .dl{color:var(--dn);font-size:10px;padding:3px;opacity:.3}
    .li:active .dl{opacity:1}

    .toast{padding:8px 16px;background:var(--cd);border:1px solid var(--bd);border-radius:8px;font-size:12px;color:var(--fg);box-shadow:0 8px 30px rgba(0,0,0,.4);animation:ti .3s ease;display:flex;align-items:center;gap:6px}
    .toast.ok{border-color:var(--tl)}.toast.ok i{color:var(--tl)}.toast.er{border-color:var(--dn)}.toast.er i{color:var(--dn)}
    @keyframes ti{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes to{from{opacity:1}to{opacity:0}}

    .mb{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .mx{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px;min-width:300px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .cd{background:#080808;border:1px solid var(--bd);border-radius:8px;padding:10px;font-family:monospace;font-size:10px;color:#999;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-all;line-height:1.4}

    #svgO{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible;touch-action:none}
    .se{pointer-events:stroke;cursor:move;touch-action:none}

    .lo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#ff6b35,#ff3535);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(255,107,53,.3)}
    .ba{background:var(--ac);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation}
    .ba:active{transform:scale(.95)}
    .bg{background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:7px;padding:7px 14px;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation}
    .bg:active{transform:scale(.95);background:var(--bd)}
    .ww{position:relative;display:flex;align-items:center;justify-content:center;flex:1;overflow:hidden;background:radial-gradient(ellipse at center,rgba(255,107,53,.02) 0%,transparent 70%)}
    #txtMeasure{position:absolute;visibility:hidden;white-space:pre;font-weight:600;line-height:1.2;font-family:'Space Grotesk',sans-serif}
  </style>
</head>
<body class="flex flex-col">
  <header class="h-11 bg-[#141414] border-b border-[#2a2a2a] flex items-center px-3 justify-between shrink-0 z-50">
    <div class="flex items-center gap-2"><div class="lo"><i class="fas fa-shapes text-white text-[10px]"></i></div><h1 class="font-['Space_Grotesk'] font-semibold text-xs tracking-tight">ShapeForge</h1></div>
    <div class="flex items-center gap-1">
      <button onclick="doUndo()" class="ab" aria-label="Undo" title="Undo"><i class="fas fa-rotate-left"></i></button>
      <button onclick="doRedo()" class="ab" aria-label="Redo" title="Redo"><i class="fas fa-rotate-right"></i></button>
      <div class="w-px h-4 bg-[#2a2a2a] mx-0.5"></div>
      <button onclick="doDupe()" class="ab" aria-label="Duplicate" title="Duplicate"><i class="fas fa-copy"></i></button>
      <button onclick="doUp()" class="ab" aria-label="Bring Forward" title="Forward"><i class="fas fa-arrow-up text-[9px]"></i></button>
      <button onclick="doDown()" class="ab" aria-label="Send Backward" title="Backward"><i class="fas fa-arrow-down text-[9px]"></i></button>
      <div class="w-px h-4 bg-[#2a2a2a] mx-0.5"></div>
      <button onclick="togGrid()" class="ab on" id="gBtn" aria-label="Toggle Grid" title="Grid"><i class="fas fa-border-all"></i></button>
      <button onclick="togSnap()" class="ab on" id="sBtn" aria-label="Toggle Snap" title="Snap"><i class="fas fa-magnet"></i></button>
      <div class="w-px h-4 bg-[#2a2a2a] mx-0.5"></div>
      <button onclick="doClear()" class="ab" aria-label="Clear Canvas" title="Clear"><i class="fas fa-trash-can"></i></button>
      <button onclick="doPreview()" class="ab" aria-label="Preview Animations" title="Preview"><i class="fas fa-play"></i></button>
      <button onclick="showExport()" class="ba text-[10px] px-2.5 py-1"><i class="fas fa-download mr-1"></i>Export</button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="w-[82px] bg-[#141414] border-r border-[#2a2a2a] flex flex-col items-center py-2 gap-1.5 shrink-0 overflow-y-auto" style="touch-action:pan-y">
      <button class="md-btn on" data-m="select" onclick="setM('select')"><i class="fas fa-arrow-pointer text-[10px]"></i>Select</button>
      <button class="md-btn" data-m="freehand" onclick="setM('freehand')"><i class="fas fa-pen text-[10px]"></i>Draw</button>
      <div class="w-10 border-t border-[#2a2a2a] my-1"></div>
      <span class="text-[7px] text-[#6b6b6b] uppercase tracking-wider font-bold">Drag to add</span>
      <div class="sh-card" data-sh="rect"><div class="pv-r"></div><span class="sl">Rect</span></div>
      <div class="sh-card" data-sh="circle"><div class="pv-c"></div><span class="sl">Circle</span></div>
      <div class="sh-card" data-sh="line"><div class="pv-l"></div><span class="sl">Line</span></div>
      <div class="sh-card" data-sh="text"><span class="pv-t">A</span><span class="sl">Text</span></div>
      <div class="w-10 border-t border-[#2a2a2a] my-1"></div>
      <span class="text-[7px] text-[#6b6b6b] uppercase tracking-wider font-bold">Colors</span>
      <div id="qcBox" class="grid grid-cols-3 gap-1 px-1"></div>
      <div class="w-10 border-t border-[#2a2a2a] my-1"></div>
      <span class="text-[7px] text-[#6b6b6b] uppercase font-bold">Fill</span>
      <div class="cs" id="fSw" style="background:#ff6b35"><input type="color" value="#ff6b35" oninput="S.fc=this.value;fSw.style.background=this.value"></div>
      <span class="text-[7px] text-[#6b6b6b] uppercase font-bold mt-1">Stroke</span>
      <div class="cs" id="sSw" style="background:#ffffff"><input type="color" value="#ffffff" oninput="S.sc=this.value;sSw.style.background=this.value"></div>
      <span class="text-[7px] text-[#6b6b6b] uppercase font-bold mt-1">Width</span>
      <input type="range" min="0" max="12" value="2" class="w-12 accent-[#ff6b35]" oninput="S.sw=+this.value">
    </aside>

    <div class="ww">
      <div id="ws" class="shadow-2xl rounded-lg overflow-hidden" style="width:900px;height:600px">
        <svg id="svgO" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="so"></div>
        <div id="txtMeasure"></div>
      </div>
    </div>

    <aside class="w-52 bg-[#141414] border-l border-[#2a2a2a] flex flex-col shrink-0 overflow-y-auto" id="rp" style="touch-action:pan-y">
      <div class="p-2"><div class="sh">Properties</div><div id="pP"></div></div>
      <div class="p-2 border-t border-[#2a2a2a]"><div class="sh">Animation</div><div id="aP"></div></div>
      <div class="p-2 border-t border-[#2a2a2a] flex-1"><div class="sh">Layers</div><div id="lL"></div></div>
    </aside>
  </div>

  <div id="dragGhost"></div>
  <div id="txM" class="mb" style="display:none"><div class="mx"><h3 class="text-sm font-semibold mb-2 font-['Space_Grotesk']">Add Text</h3><input type="text" id="txI" class="pi mb-2" placeholder="Type your text..."><div class="flex gap-2 justify-end"><button class="bg text-[10px]" onclick="txCancel()">Cancel</button><button class="ba text-[10px]" onclick="txOk()">Add</button></div></div></div>
  <div id="exM" class="mb" style="display:none"><div class="mx" style="max-width:600px;width:90vw"><h3 class="text-sm font-semibold mb-1 font-['Space_Grotesk']">Export HTML</h3><p class="text-[10px] text-[#6b6b6b] mb-2">Standalone file with styles and animations.</p><div class="cd" id="exC"></div><div class="flex gap-2 justify-end mt-3"><button class="bg text-[10px]" onclick="exClose()">Close</button><button class="bg text-[10px]" onclick="exCopy()"><i class="fas fa-copy mr-1"></i>Copy Code</button><button class="ba text-[10px]" onclick="exDown()"><i class="fas fa-download mr-1"></i>Download File</button></div></div></div>
  <div id="tst" class="fixed bottom-3 right-3 flex flex-col gap-1.5 z-[9999]"></div>

  <script>
    document.addEventListener('contextmenu',e=>e.preventDefault());
    document.addEventListener('dragstart',e=>e.preventDefault());
    document.addEventListener('selectstart',e=>{if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault()});

    const AN={
      none:{l:'None',c:''},fadeIn:{l:'Fade In',c:'@keyframes fadeIn{from{opacity:0}to{opacity:1}}'},
      fadeOut:{l:'Fade Out',c:'@keyframes fadeOut{from{opacity:1}to{opacity:0}}'},
      slideLeft:{l:'Slide Left',c:'@keyframes slideLeft{from{transform:translateX(-120px);opacity:0}to{transform:translateX(0);opacity:1}}'},
      slideRight:{l:'Slide Right',c:'@keyframes slideRight{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}'},
      slideUp:{l:'Slide Up',c:'@keyframes slideUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}'},
      slideDown:{l:'Slide Down',c:'@keyframes slideDown{from{transform:translateY(-80px);opacity:0}to{transform:translateY(0);opacity:1}}'},
      bounceIn:{l:'Bounce In',c:'@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}'},
      rotateIn:{l:'Rotate In',c:'@keyframes rotateIn{from{transform:rotate(-200deg) scale(0);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}'},
      pulse:{l:'Pulse',c:'@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}'},
      shake:{l:'Shake',c:'@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}'},
      float:{l:'Float',c:'@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}'},
      scaleUp:{l:'Scale Up',c:'@keyframes scaleUp{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}'},
      swing:{l:'Swing',c:'@keyframes swing{20%{transform:rotate(15deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-5deg)}100%{transform:rotate(0)}}'},
      flash:{l:'Flash',c:'@keyframes flash{0%,50%,100%{opacity:1}25%,75%{opacity:0}}'},
      rubberBand:{l:'Rubber Band',c:'@keyframes rubberBand{0%{transform:scaleX(1)}30%{transform:scaleX(1.25) scaleY(.75)}40%{transform:scaleX(.75) scaleY(1.25)}50%{transform:scaleX(1.15) scaleY(.85)}65%{transform:scaleX(.95) scaleY(1.05)}75%{transform:scaleX(1.05) scaleY(.95)}100%{transform:scaleX(1) scaleY(1)}}'},
      zoomOut:{l:'Zoom Out',c:'@keyframes zoomOut{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}'}
    };
    {let c='';Object.values(AN).forEach(a=>{if(a.c)c+=a.c+'\n'});const s=document.createElement('style');s.textContent=c;document.head.appendChild(s)}

    const QCOLS=['#ff6b35','#ff4757','#ff6b81','#ffa502','#ffdd59','#2ed573','#00d4aa','#1e90ff','#5352ed','#a55eea','#ffffff','#747d8c','#2f3542','#0d0d0d','#1a1a2e','#57606f','#c8d6e5','#f8b500'];

    const S={els:[],sel:null,mode:'select',fc:'#ff6b35',sc:'#ffffff',sw:2,fs:32,bg:'#1a1a2e',nid:1,undo:[],redo:[],grid:true,snap:true,exCode:'',gesture:'IDLE'};
    const IX={pid:-1,dx:0,dy:0,pts:new Map(),pinchD:0,pinchW:0,pinchH:0,pinchCX:0,pinchCY:0,pinchIP:null,pinchIL:null,rh:'',rs:{},ep:'',fhPts:[],sbShape:null,txPos:null};

    const ws=document.getElementById('ws');const svgO=document.getElementById('svgO');const so=document.getElementById('so');
    const pP=document.getElementById('pP');const aP=document.getElementById('aP');const lL=document.getElementById('lL');
    const fSw=document.getElementById('fSw');const sSw=document.getElementById('sSw');const ghost=document.getElementById('dragGhost');
    const tm=document.getElementById('txtMeasure');

    function gid(){return S.nid++}function gel(id){return S.els.find(e=>e.id===id)}
    function gpos(cx,cy){const r=ws.getBoundingClientRect();return{x:cx-r.left,y:cy-r.top}}
    function snap(v){return S.snap?Math.round(v/20)*20:v}
    function ptSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;if(l2===0)return Math.hypot(px-x1,py-y1);let t=((px-x1)*dx+(py-y1)*dy)/l2;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
    function fhBB(pts){if(!pts.length)return{x:0,y:0,w:0,h:0};let a=1e9,b=1e9,c=-1e9,d=-1e9;pts.forEach(p=>{a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y)});return{x:a,y:b,w:c-a,h:d-b}}
    function pts2d(pts){if(pts.length<2)return'';let d='M '+pts[0].x+' '+pts[0].y;for(let i=1;i<pts.length-1;i++){const cx=(pts[i].x+pts[i+1].x)/2,cy=(pts[i].y+pts[i+1].y)/2;d+=' Q '+pts[i].x+' '+pts[i].y+' '+cx+' '+cy}d+=' L '+pts[pts.length-1].x+' '+pts[pts.length-1].y;return d}
    function toast(m,t='info'){const e=document.createElement('div');e.className='toast '+(t==='ok'?'ok':t==='er'?'er':'');e.innerHTML='<i class="fas '+(t==='ok'?'fa-check-circle':t==='er'?'fa-exclamation-circle':'fa-info-circle')+'"></i> '+m;document.getElementById('tst').appendChild(e);setTimeout(()=>{e.style.animation='to .3s ease forwards';setTimeout(()=>e.remove(),300)},2000)}
    function saveU(){S.undo.push(JSON.parse(JSON.stringify(S.els)));if(S.undo.length>40)S.undo.shift();S.redo=[]}
    function measureText(t,fs){tm.textContent=t;tm.style.fontSize=fs+'px';return{w:Math.ceil(tm.offsetWidth)+4,h:Math.ceil(tm.offsetHeight)+2}}

    function hitEl(x,y){for(let i=S.els.length-1;i>=0;i--){if(hitT(S.els[i],x,y))return S.els[i]}return null}

    function onMove(e){IX.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(S.gesture==='PINCH'){doPinch();return}if(e.pointerId!==IX.pid)return;const pos=gpos(e.clientX,e.clientY);if(S.gesture==='DRAG'&&S.sel){const el=gel(S.sel);if(!el)return;let nx=snap(pos.x-IX.dx),ny=snap(pos.y-IX.dy);if(el.type==='freehand'){const bb=fhBB(el.points);const ddx=nx-bb.x,ddy=ny-bb.y;el.points.forEach(p=>{p.x+=ddx;p.y+=ddy})}else if(el.type==='line'){const ddx=nx-el.x,ddy=ny-el.y;el.x+=ddx;el.y+=ddy;el.x2+=ddx;el.y2+=ddy}else{el.x=nx;el.y=ny}uEl(el);return}if(S.gesture==='RESIZE'&&S.sel){const el=gel(S.sel);if(!el)return;const dx=pos.x-IX.rs.mx,dy=pos.y-IX.rs.my,h=IX.rh,r=IX.rs,MN=20;let nx=r.x,ny=r.y,nw=r.w,nh=r.h;if(h.includes('r'))nw=Math.max(MN,r.w+dx);if(h.includes('l')){nx=r.x+dx;nw=Math.max(MN,r.w-dx);if(nw===MN)nx=r.x+r.w-MN}if(h.includes('b'))nh=Math.max(MN,r.h+dy);if(h.includes('t')){ny=r.y+dy;nh=Math.max(MN,r.h-dy);if(nh===MN)ny=r.y+r.h-MN}if(el.type==='circle'){nh=nw;if(h.includes('t'))ny=r.y+r.h-nh;if(h.includes('l'))nx=r.x+r.w-nw}el.x=snap(nx);el.y=snap(ny);el.width=snap(nw);el.height=snap(nh);uEl(el);uPP();return}if(S.gesture==='ENDPOINT'&&S.sel){const el=gel(S.sel);if(!el)return;if(IX.ep==='ep1'){el.x=snap(pos.x);el.y=snap(pos.y)}else{el.x2=snap(pos.x);el.y2=snap(pos.y)}uEl(el);uPP();return}if(S.gesture==='FREEHAND'){IX.fhPts.push({x:pos.x,y:pos.y});let tg=svgO.querySelector('#tmpD');if(!tg){const ns='http://www.w3.org/2000/svg';tg=document.createElementNS(ns,'g');tg.id='tmpD';const p=document.createElementNS(ns,'path');p.id='tmpP';p.setAttribute('fill','none');p.setAttribute('stroke',S.sc);p.setAttribute('stroke-width',S.sw);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');tg.appendChild(p);svgO.appendChild(tg)}svgO.querySelector('#tmpP').setAttribute('d',pts2d(IX.fhPts));return}}

    function startPinch(){const el=gel(S.sel);if(!el)return;S.gesture='PINCH';const pts=Array.from(IX.pts.values());IX.pinchD=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);IX.pinchW=el.width;IX.pinchH=el.height;IX.pinchCX=el.x+el.width/2;IX.pinchCY=el.y+el.height/2;if(el.type==='line'){IX.pinchIL={x:el.x,y:el.y,x2:el.x2,y2:el.y2};IX.pinchCX=(el.x+el.x2)/2;IX.pinchCY=(el.y+el.y2)/2}if(el.type==='freehand'){IX.pinchIP=el.points.map(p=>({...p}));const bb=fhBB(el.points);IX.pinchCX=bb.x+bb.w/2;IX.pinchCY=bb.y+bb.h/2}}

    function uProp(id,p,v){const el=gel(id);if(!el)return;saveU();if((p==='x'||p==='y')&&el.type==='freehand'){const bb=fhBB(el.points);const dx=p==='x'?v-bb.x:0,dy=p==='y'?v-bb.y:0;el.points.forEach(pt=>{pt.x+=dx;pt.y+=dy})}else{el[p]=v}uEl(el);uLay()}

    function uAP(){if(!S.sel){aP.innerHTML='<p class="text-[10px] text-[#6b6b6b]">Select to animate</p>';return}const el=gel(S.sel);if(!el)return;const a=el.animation;let h='<div class="mb-1.5"><div class="pl">Type</div><select class="pi" onchange="uAn('+el.id+',\'type\',this.value)">';Object.entries(AN).forEach(([k,v])=>{h+='<option value="'+k+'"'+(a.type===k?' selected':'')+'>'+v.l+'</option>'});h+='</select></div>';h+='<div class="grid grid-cols-2 gap-1.5 mb-1.5"><div><div class="pl">Duration</div><input class="pi" value="'+a.duration+'" onchange="uAn('+el.id+',\'duration\',this.value)"></div><div><div class="pl">Delay</div><input class="pi" value="'+a.delay+'" onchange="uAn('+el.id+',\'delay\',this.value)"></div></div>';h+='<div class="grid grid-cols-2 gap-1.5 mb-1.5"><div><div class="pl">Repeat</div><select class="pi" onchange="uAn('+el.id+',\'iteration\',this.value)"><option value="1"'+(a.iteration==='1'?' selected':'')+'>1</option><option value="2"'+(a.iteration==='2'?' selected':'')+'>2</option><option value="3"'+(a.iteration==='3'?' selected':'')+'>3</option><option value="5"'+(a.iteration==='5'?' selected':'')+'>5</option><option value="infinite"'+(a.iteration==='infinite'?' selected':'')+'>Infinite</option></select></div><div><div class="pl">Easing</div><select class="pi" onchange="uAn('+el.id+',\'easing\',this.value)"><option value="ease"'+(a.easing==='ease'?' selected':'')+'>Ease</option><option value="ease-in"'+(a.easing==='ease-in'?' selected':'')+'>In</option><option value="ease-out"'+(a.easing==='ease-out'?' selected':'')+'>Out</option><option value="ease-in-out"'+(a.easing==='ease-in-out'?' selected':'')+'>In-Out</option><option value="linear"'+(a.easing==='linear'?' selected':'')+'>Linear</option></select></div></div>';h+='<button onclick="prevAn('+el.id+')" class="bg w-full text-[10px] mt-1"><i class="fas fa-play mr-1"></i>Preview</button>';aP.innerHTML=h}

    function prevAn(id){const el=gel(id);if(!el||el.animation.type==='none')return;const dom=el.type==='freehand'||el.type==='line'?svgO.querySelector('g[data-id="'+id+'"]'):ws.querySelector('div[data-id="'+id+'"]');if(!dom)return;dom.style.animation='none';void dom.offsetHeight;dom.style.animation=el.animation.type+' '+el.animation.duration+' '+el.animation.easing+' '+el.animation.delay+' '+el.animation.iteration+' both';toast('Previewing: '+AN[el.animation.type].l,'ok')}

    document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;switch(e.key.toLowerCase()){case'v':setM('select');break;case'p':setM('freehand');break;case'delete':case'backspace':if(S.sel)doDel(S.sel);break;case'escape':desel();break;case'd':if(e.ctrlKey||e.metaKey){e.preventDefault();doDupe()}break;case'z':if(e.ctrlKey||e.metaKey){e.preventDefault();if(e.shiftKey)doRedo();else doUndo()}break;case'g':togGrid();break}});

    function showExport(){const W=ws.clientWidth||900,H=ws.clientHeight||600;let kf='',ec='',eh='';const used=new Set();S.els.forEach(e=>used.add(e.animation.type));used.forEach(a=>{if(AN[a]&&AN[a].c)kf+=AN[a].c+'\n'});S.els.forEach(el=>{const cls='sf-'+el.id;let an='';if(el.animation.type!=='none')an='animation:'+el.animation.type+' '+el.animation.duration+' '+el.animation.easing+' '+el.animation.delay+' '+el.animation.iteration+' both;transform-origin:center;';if(el.type==='rect'){ec+='.'+cls+'{position:absolute;left:'+el.x+'px;top:'+el.y+'px;width:'+el.width+'px;height:'+el.height+'px;background:'+el.fill+';border:'+el.strokeWidth+'px solid '+el.stroke+';border-radius:4px;opacity:'+el.opacity+';'+an+'}\n';eh+='    <div class="'+cls+'"></div>\n'}else if(el.type==='circle'){ec+='.'+cls+'{position:absolute;left:'+el.x+'px;top:'+el.y+'px;width:'+el.width+'px;height:'+el.height+'px;background:'+el.fill+';border:'+el.strokeWidth+'px solid '+el.stroke+';border-radius:50%;opacity:'+el.opacity+';'+an+'}\n';eh+='    <div class="'+cls+'"></div>\n'}else if(el.type==='text'){ec+='.'+cls+'{position:absolute;left:'+el.x+'px;top:'+el.y+'px;width:'+el.width+'px;height:'+el.height+'px;color:'+el.fill+';font-size:'+el.fontSize+'px;font-family:\'Space Grotesk\',system-ui,sans-serif;font-weight:600;line-height:1.2;white-space:pre-wrap;opacity:'+el.opacity+';'+an+'}\n';eh+='    <div class="'+cls+'">'+el.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>\n'}else if(el.type==='line'||el.type==='freehand'){const d=el.type==='line'?'M '+el.x+' '+el.y+' L '+el.x2+' '+el.y2:pts2d(el.points);ec+='.'+cls+'{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;'+an+'}\n';eh+='    <svg class="'+cls+'" xmlns="http://www.w3.org/2000/svg"><path d="'+d+'" stroke="'+el.stroke+'" stroke-width="'+el.strokeWidth+'" fill="none" stroke-linecap="round"/></svg>\n'}});S.exCode='<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>ShapeForge Export</title>\n  <style>\n    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}\n    body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:'+S.bg+'}\n    .canvas{position:relative;width:'+W+'px;height:'+H+'px;background:'+S.bg+';overflow:hidden}\n'+kf+ec+'  </style>\n</head>\n<body>\n  <div class="canvas">\n'+eh+'  </div>\n</body>\n</html>';document.getElementById('exC').textContent=S.exCode;document.getElementById('exM').style.display='flex'}
