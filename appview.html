<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Preview · V2H</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><header class="topbar"><a href="index.html" class="bg"><i class="fas fa-arrow-left"></i> Workspace</a><strong id="title">App Preview</strong><span class="badge">Local preview</span></header><main class="max-w-5xl mx-auto px-5 py-8"><input id="search" class="pi mb-5" placeholder="Search records…"><div id="items" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div></main><script src="js/api.js"></script><script>const id=new URLSearchParams(location.search).get('id');let rows=[],app;const esc=V2H.esc;async function boot(){if(!id){document.getElementById('items').textContent='Choose an app from the workspace.';return}try{app=(await V2H.api('GET','/api/collections/'+id)).collection;rows=(await V2H.api('GET','/api/collections/'+id+'/records')).records;document.getElementById('title').textContent=app.name;document.title=app.name+' · V2H';draw()}catch(e){document.getElementById('items').textContent=e.message}}function draw(){const q=document.getElementById('search').value.toLowerCase();const list=rows.filter(r=>!q||app.fields.some(f=>String(r[f.key]||'').toLowerCase().includes(q)));document.getElementById('items').innerHTML=list.map(r=>'<article class="panel p-5"><div class="badge mb-3">'+esc(app.name)+'</div><h2 class="text-lg font-semibold mb-2">'+esc(r[(app.views||{}).primaryField]||r[app.fields[0]?.key]||'Entry')+'</h2>'+app.fields.filter(f=>f.key!==(app.views||{}).primaryField&&r[f.key]!==''&&r[f.key]!=null).map(f=>'<p class="text-xs text-[#aaa] mt-2"><b>'+esc(f.name)+':</b> '+esc(r[f.key])+'</p>').join('')+'</article>').join('')||'<div class="empty">No records found.</div>'}document.getElementById('search').addEventListener('input',draw);boot();</script></body></html>
